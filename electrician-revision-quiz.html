const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function oneAway(a, b){
  if(a === b || Math.abs(a.length - b.length) > 1) return false;
  let i = 0;
  while(i < a.length && i < b.length && a[i] === b[i]) i++;
  if(a.length === b.length) return a.slice(i+1) === b.slice(i+1) || (a[i] === b[i+1] && a[i+1] === b[i] && a.slice(i+2) === b.slice(i+2));
  return a.length > b.length ? a.slice(i+1) === b.slice(i) : a.slice(i) === b.slice(i+1);
}
function grade(answer, accepted){
  const a = norm(answer), list = accepted.map(norm);
  if(!a) return 'no';
  if(list.includes(a)) return 'ok';
  return list.some(x => oneAway(a, x)) ? 'near' : 'no';
}

  part('1 · The tools', '#F5A340', 'Look at the photo. Write the name of each object.', 'Regarde la photo. Écris le nom de chaque objet.');
  add('<img src="' + PHOTO + '" alt="Photo : quatre objets repérés par les lettres A à D">');
  PICTURE.forEach(p => question('s1', p[0], p[1]));
  part('2 · Vocabulary', '#F5A340', 'Write the English words.', 'Écris les mots en anglais.');
  const pool = WORDS.slice();
  for(let i = 0; i < 10; i++){ const w = pool.splice(Math.floor(Math.random() * pool.length), 1)[0]; question('s1', w[0], w[1]); }
  part('3 · Be + verb-ing', '#8E6FD8', 'Complete the sentence with the verb.', 'Complète la phrase avec le verbe.');
  GRAMMAR.forEach(g => question('s2', g[0], g[1]));
  part('4 · Explain what you are doing', '#2F4170', 'Write the sentence in English. Use the tense for an action happening as you speak.', 'Écris la phrase en anglais. Utilise le temps adapté à une action qui se passe au moment où on la dit.');
  EXPLAIN.forEach(e => question('s3', e[0], e[1]));
  document.getElementById('score').style.display = 'none';
  document.getElementById('again').style.display = 'none';
  document.getElementById('check').style.display = '';
}

document.getElementById('check').addEventListener('click', () => {
  let score = 0;
  items.forEach((accepted, n) => {
    const input = document.getElementById('i' + n), fb = document.getElementById('f' + n);
    const result = grade(input.value, accepted);
    input.disabled = true;
    if(result === 'ok'){ score++; fb.className = 'fb ok'; fb.textContent = '✓ Correct'; }
    else { fb.className = 'fb ' + result; fb.textContent = (result === 'near' ? 'Presque ! ' : '✗ ') + 'Réponse : ' + accepted[0]; }
  });
  const box = document.getElementById('score');
  box.textContent = score + ' / ' + items.length;
  box.style.display = 'block';
  document.getElementById('check').style.display = 'none';
  document.getElementById('again').style.display = '';
  if(window.logPracticeAttempt) logPracticeAttempt("Electrician's Guide — Revision", score, items.length);
});
document.getElementById('again').addEventListener('click', () => { build(); window.scrollTo(0, 0); });
build();
</script>
