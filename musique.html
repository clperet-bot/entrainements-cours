<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Révise en musique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bleu:#3B7DFF; --violet:#7C5CFA; --vert:#1FB57F; --rose:#F0589B;
    --encre:#1F2350; --fond:#F5F4FF; --blanc:#fff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Poppins','Nunito','Segoe UI',Arial,sans-serif;
    background:var(--fond); color:var(--encre);
    padding:20px 16px 48px; line-height:1.4;
  }
  .page{max-width:680px;margin:0 auto}
  header{text-align:center;margin:8px 0 26px}
  header h1{font-size:2.1rem;font-weight:800;color:var(--rose)}
  header p{font-size:1.05rem;opacity:.75;margin-top:4px}

  .liste{display:flex;flex-direction:column;gap:14px}
  .carte{
    background:var(--blanc); border-radius:18px; padding:16px;
    box-shadow:0 2px 0 rgba(31,35,80,.08), 0 6px 14px rgba(31,35,80,.06);
  }
  .entete{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .num{
    flex:0 0 44px;height:44px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:800;font-size:1.15rem;
  }
  .c1{background:var(--bleu)} .c2{background:var(--violet)}
  .c3{background:var(--vert)} .c4{background:var(--rose)}
  .titre{font-weight:700;font-size:1.05rem}
  .detail{font-size:.9rem;opacity:.7;margin-top:2px}
  audio{width:100%}
  .paroles{margin-top:14px;padding:14px 16px;background:var(--fond);border-radius:14px;font-size:1.05rem;line-height:1.7}
  .paroles .partie{display:block;margin:14px 0 4px;font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--violet)}
  .paroles .partie:first-child{margin-top:0}
  .paroles .ligne{display:block}
  .paroles .trad{display:none;font-size:.92rem;opacity:.65;font-style:italic;margin-bottom:6px}
  .paroles.avec-trad .trad{display:block}
  .btn-trad{margin-top:12px;font-family:inherit;font-weight:600;font-size:.95rem;color:#fff;background:var(--rose);border:0;border-radius:999px;padding:9px 18px;cursor:pointer}
  .ruban{
    display:inline-block; color:#fff; font-weight:700; font-size:1.2rem;
    padding:9px 34px 9px 22px; margin:22px 0 14px -6px;
    clip-path:polygon(0 0,100% 0,calc(100% - 16px) 50%,100% 100%,0 100%);
  }
  .ruban.anglais{background:var(--violet)}
  .ruban.francais{background:var(--vert)}
  .vide{
    text-align:center;background:var(--blanc);border-radius:18px;padding:28px 18px;
    font-weight:600;font-size:1.05rem;
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <h1>Révise en musique</h1>
    <p>Choisis ton cours, mets tes écouteurs et écoute.</p>
  </header>
  <div id="vide" class="vide" style="display:none">Les premières musiques arrivent bientôt.</div>

  <div id="bloc-anglais" style="display:none">
    <div class="ruban anglais">Anglais</div>
    <div class="liste" id="anglais"></div>
  </div>

  <div id="bloc-francais" style="display:none">
    <div class="ruban francais">Français</div>
    <div class="liste" id="francais"></div>
  </div>
</div>

<script>
  // Pour ajouter une musique : [titre du cours, détail, fichier audio, paroles]
  // dans la bonne matière. Les paroles sont facultatives : entre accents graves (`),
  // une ligne [Verse 1] ou [Chorus] devient un petit titre de partie.
  // Pour la traduction : on l'écrit après une barre verticale sur la même ligne
  //   Clue, clue, look for a clue | Indice, indice, cherche un indice
  // Un bouton « Voir la traduction » apparaît alors sous les paroles.
  // Exemple :
  // ["Solve the Mystery : le vocabulaire de l'enquête", "Cluedo", "solve-the-mystery-musique.mp3", `[Verse 1]
  // There's a note by the locker...
  // [Chorus]
  // Clue, clue, look for a clue...`],
  var MUSIQUES = {
    anglais: [
      ["Solve the Mystery : le vocabulaire de l'enquête", "Cluedo", "solve-the-mystery-musique.mp3", `[Verse 1]
There's a note by the locker, with no name on it | Il y a un mot près du casier, sans nom dessus
A small red object, take a look at it! | Un petit objet rouge, regarde-le !
Five suspects, five stories, who tells the truth? | Cinq suspects, cinq histoires, qui dit la vérité ?
We need a witness, we need some proof. | Il nous faut un témoin, il nous faut une preuve.
[Chorus]
Clue, clue, look for a clue | Indice, indice, cherche un indice
Fingerprint, what can it tell you? | L'empreinte, que peut-elle te dire ?
Suspect, witness, alibi, | Suspect, témoin, alibi,
Find the culprit, don't let them lie! | Trouve le coupable, ne le laisse pas mentir !
[Verse 2]
"She was seen near the gym," the witness said, | « Elle a été vue près du gymnase », a dit le témoin,
"The fingerprint matches hers," it's in my head. | « L'empreinte lui correspond », c'est dans ma tête.
"The bracelet belongs to her," that's a clue, | « Le bracelet lui appartient », c'est un indice,
"Other suspects have alibis," so who, who, who? | « Les autres suspects ont des alibis », alors qui, qui, qui ?
[Chorus]
Clue, clue, look for a clue | Indice, indice, cherche un indice
Fingerprint, what can it tell you? | L'empreinte, que peut-elle te dire ?
Suspect, witness, alibi, | Suspect, témoin, alibi,
Find the culprit, don't let them lie! | Trouve le coupable, ne le laisse pas mentir !
[Bridge]
Student council, a meeting at two, | Le conseil des élèves, une réunion à deux heures,
Witnesses there, so an alibi too. | Des témoins présents, donc un alibi aussi.
Say it again, say it loud, | Répète-le, dis-le fort,
Clue, culprit, alibi, proof! | Indice, coupable, alibi, preuve !
[Final Chorus]
Clue, clue, look for a clue | Indice, indice, cherche un indice
Fingerprint, what can it tell you? | L'empreinte, que peut-elle te dire ?
Suspect, witness, alibi, | Suspect, témoin, alibi,
Find the culprit, don't let them lie! | Trouve le coupable, ne le laisse pas mentir !
[Outro]
Solve the mystery! | Résous le mystère !`]
    ],
    francais: [
      ["La poésie", "La musique du cours", "musique-poesie.mp3"]
    ]
  };

  function afficher(matiere){
    var liste = MUSIQUES[matiere];
    if (liste.length === 0) return 0;
    document.getElementById("bloc-" + matiere).style.display = "block";
    var conteneur = document.getElementById(matiere);
    liste.forEach(function(m, i){
      var d = document.createElement("div");
      d.className = "carte";
      d.innerHTML =
        '<div class="entete"><div class="num c' + ((i % 4) + 1) + '">' + (i + 1) + '</div>' +
        '<div><div class="titre"></div><div class="detail"></div></div></div>' +
        '<audio controls preload="none"></audio>';
      d.querySelector(".titre").textContent = m[0];
      d.querySelector(".detail").textContent = m[1];
      d.querySelector("audio").src = m[2];
      if (m[3]) {
        var p = document.createElement("div");
        p.className = "paroles";
        var aTrad = false;
        m[3].split("\n").forEach(function(l){
          l = l.trim();
          if (!l) return;
          var span = document.createElement("span");
          if (l.charAt(0) === "[" && l.charAt(l.length - 1) === "]") {
            span.className = "partie";
            span.textContent = l.slice(1, -1);
            p.appendChild(span);
            return;
          }
          var morceaux = l.split("|");
          span.className = "ligne";
          span.textContent = morceaux[0].trim();
          p.appendChild(span);
          if (morceaux.length > 1 && morceaux[1].trim()) {
            aTrad = true;
            var t = document.createElement("span");
            t.className = "trad";
            t.textContent = morceaux[1].trim();
            p.appendChild(t);
          }
        });
        if (aTrad) {
          var b = document.createElement("button");
          b.className = "btn-trad";
          b.textContent = "Voir la traduction";
          b.onclick = function(){
            var on = p.classList.toggle("avec-trad");
            b.textContent = on ? "Cacher la traduction" : "Voir la traduction";
          };
          d.appendChild(p);
          d.appendChild(b);
        } else {
          d.appendChild(p);
        }
      }
      conteneur.appendChild(d);
    });
    return liste.length;
  }
  var total = afficher("anglais") + afficher("francais");
  if (total === 0) document.getElementById("vide").style.display = "block";
</script>
</body>
</html>
